<div class="row">
  <div class="col-xs-12">
    <img 
    [src]="recipe.imagePath" alt="{{ recipe.name }}" 
    class="img-responsive"
    style="max-height: 300px;">
  </div>
</div>
<div class="row">
  <div class="col-xs-12">
    <h1>
      {{ recipe.name }}
    </h1>
  </div>
</div>
<div class="row">
  <div class="col-xs-12">
    <div class="dropdown">
          <button 
            class="btn btn-primary dropdown-toggle" href="#" 
            id="navbarDropdown" role="button" data-bs-toggle="dropdown"
            aria-expanded="false">
            Manage
          </button>
              <ul 
              class="dropdown-menu" 
              aria-labelledby="navbarDropdown">
                <li><a class="dropdown-item" (click)="onAddToShoppingList()" 
                  style="cursor: pointer;">To Shopping List</a></li>
                <li><a class="dropdown-item" href="#">Edit Recipe</a></li>
                <li><a class="dropdown-item" href="#">Delete Recipe</a></li>
              </ul>
    </div>
  </div>
</div>
<div class="row">
  <div class="col-xs-12">
    {{ recipe.name }}
  </div>
</div>
<div class="row">
  <div class="col-xs-12">
    <ul class="list-group">

      @for(ingredient of recipe.ingredients; track ingredient.id){
        <li class="list-group-item" >
          {{ingredient.name}} - {{ingredient.amount}}
        </li>
      }
    </ul>
  </div>
</div>
