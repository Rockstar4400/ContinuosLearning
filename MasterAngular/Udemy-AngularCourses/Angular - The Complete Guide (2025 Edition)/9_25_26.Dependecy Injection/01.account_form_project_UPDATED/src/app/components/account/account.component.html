<div class="row">
  <div class="col-xs-12 col-md-8 col-md-offset-2">
    <h5>{{ account.name }}</h5>
    <hr>
    <p>This account is {{ account.status }}</p>
      <button 
      class="btn btn-outline-secondary" 
      (click)="onSetTo('active', account.name )">
        Set to 'active'
      </button>

      <button 
      class="btn btn-outline-secondary" 
      (click)="onSetTo('inactive', account.name )">
        Set to 'inactive'
      </button>

      <button 
      class="btn btn-outline-secondary" 
      (click)="onSetTo('unknown', account.name )">
        Set to 'unknown'
      </button>
  </div>
</div>
